[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.2"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/system"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/branding"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
